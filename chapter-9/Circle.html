<html>
    <script>
        class Circle{
            constructor(radius){
                this.radius = radius;
            };

            get area(){
                return this.radius * this.radius * Math.PI;
            }
        }

        let c1 = new Circle(10);
        let c2 = new Circle(12);
        console.log("c1 ,",c1.area , "c2 ,",c2.area)
        console.log("c1 instanceof Circle ,", c1 instanceof Circle); // true
        console.log("c1 instanceof Object ,", c1 instanceof Object); // true
        console.log("c1 instanceof Array ,", c1 instanceof Array); // false
    </script>
</html>
