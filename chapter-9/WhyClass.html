<html>
  <script>
    let obj = {
      name: "John",
      age: 28,
      display() {
        console.log("His name is", this.name, "and age is ", this.age, ".");
      },
    };
    obj.display();

    let shoppingCart = {
      items: [],
      addItem(item) {
        this.items.push(item);
        console.log("addItem,", this.items);
      },
      displayItem(){
        for(const item of this.items){
            console.log(` "name" , ${item.name} , "qty" , ${item.qty} , "price" , ${item.price}`)
        }
      }
    };

    shoppingCart.addItem({
        name:"apple",
        qty:20,
        price:30
    })
    shoppingCart.addItem({
        name:"orange",
        qty:30,
        price:40
    })
    shoppingCart.displayItem()
  </script>
</html>
