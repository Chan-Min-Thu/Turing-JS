<html>
  <script>
    let counter = 0;
    counter++;
    console.log(counter);
    let arr = [1, 3, 5];
    console.log(
      "result",
      arr.map((x) => x * 2),
    ); /* map သည် transform လုပ်တဲ့ function , 
        array အသစ် တစ်ခု ရမယ် အဲ့တာကို Funtor လို့‌ ခေါ်တယ် */

    const Container = (x) => ({
      map: (fun) => Container(fun(x)),
      valueOf: () => x,
    });
    Container.of = Container;

    let inc = (x) => x + 1;
    let counter1 = Container(10);
    console.log("counter1", counter1);

    let counter2 = counter1.map(inc);
    console.log("counter2.valueOf", counter2.valueOf());

    let counter3 = Container(20)
      .map((x) => x * 2)
      .map((x) => x + 1);

    console.log("counter3",counter3.valueOf())
  </script>
</html>
