<html>
  <script src="//cdnjs.cloudflare.com/ajax/libs/ramda/0.31.3/ramda.min.js"></script>
  <script>
    let items = [1, 1, 2, 2, 3, 4, 3, 3, 2, 3, 5, 3, 2];
    let k = 2;
    /*
    let group = R.countBy(R.identity)(items);

    let sorted = R.sort((a, b) => b[1] - a[1])(arr);

    let topKFun = R.pipe(
      R.countBy(R.identity),
      R.toPairs(),
      R.sort((a,b)=>b[1]-a[1]),
      R.map(x=>x[0]),
      R.take(k)
    );

    let topK = topKFun(items)
    console.log("topK",topK)
  </script>
