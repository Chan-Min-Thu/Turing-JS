<html>
    <script>
        let nums = [1,2,3,4,5,6,7,8,9]

        let isEven = (item)=> item%2 === 0;

        let evenList = nums.filter(isEven);

        function not(fn){
            return function(x){
                return !fn(x);
            }
        }

        let isOdd = not(isEven)
        let oddList = nums.filter(isOdd)
        console.log("even list", evenList)
        console.log("odd list", oddList)
    </script>
</html>
