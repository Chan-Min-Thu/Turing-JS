<html>
  <script>
    let i = 0; // initilization
    while (i < 5) {
      // check condition
      console.log("hello", i);
      i++; // increase
    }
    console.log("End of loop.");
    i = 1;
    let sum = 0;
    while (i <= 5) {
      sum += i;

      i++;
    }
    console.log("sum", sum);
  </script>
</html>
