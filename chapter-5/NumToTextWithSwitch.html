<html>
  <script>
    let num = +window.prompt("Enter one of 1,2,3.");

    switch (num) {
      case 1:
        console.log("one");
        break;
      case 2:
        console.log("two");
        break;
      case 3:
      case 4:
        console.log("three or four");
        break;
      default:
        console.log("others");
    }
  </script>
</html>
