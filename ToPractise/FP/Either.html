<html>
<script src="//cdnjs.cloudflare.com/ajax/libs/ramda/0.31.3/ramda.min.js"></script>
<script>
    let Left = (x) => ({

        map() {
            return Left.of(x)
        },
        matchWith({left,right}){
            return left(x)
        },
        valueOf: () => x,
    })

    Left.of = Left;

    let Right = (x) => ({
        map(fn){ 
            return Right.of(fn(x))
        },
        matchWith({left,right}){
            return right(x)
        },
        valueOf: () => x
    })
    Right.of = Right;

    function div(a, b) {
        if (isNaN(a) || isNaN(b)) {
            return Left.of("a or b is not a number.");
        } else {
            return Right.of(a / b);
        }
    }

    let inc = (x) => x + 1;

    div(12,2)
    .matchWith({left:()=>Right.of(10),right:(x)=>Right.of(x)})
    .map(inc)
    .matchWith({left:(x)=>console.log("Error is ",x),right:(x)=>console.log("Success is",x)})
</script>
