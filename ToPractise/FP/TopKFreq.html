<html>
      <script src="//cdnjs.cloudflare.com/ajax/libs/ramda/0.31.3/ramda.min.js"></script>
    <script>
        let nums = [1,1,1,3,4,5,3,3,4,2,2,3,5,4];
        
        
        function topK(nums){
            let freq = {};
            for(let i=0;i<nums.length;i++){
                if(freq[nums[i]]){
                    freq[nums[i]]++;
                }else{
                    freq[nums[i]]=1;
                }
            }
            return freq;
        }
        
        function toArray(freq){
           return Object.entries(freq);
        }

        function sortArray(arr){
            return arr.sort((a,b)=>b[1]-a[1]);
        }

        function extractTopK(arr){
            return arr.map((item)=>item[0]);
        }

        let topKFreq = R.pipe(topK,toArray,sortArray,extractTopK,arr=>arr.slice(0,3));
        console.log(topKFreq(nums));
      
    </script>
</html>
