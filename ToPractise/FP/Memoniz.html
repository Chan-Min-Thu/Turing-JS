<html>
    <script>
        function factorial(n){
            console.log("this already ran.")
         let result = 1;
            for(let i=1;i<=n;i++){
                result *= i;
            }
          return result;
        }


        function memonize(fn){
            let cache = {};
            return function(x){
                if(cache[x]){
                    return cache[x];
                }else{
                    let result = fn(x);
                    cache[x] = result;
                    return result;
                }   
            }
        }

        let cache= memonize(factorial);
        console.log("cache(5)",cache(5))
        console.log("cahce", cache(10))
        console.log("cache(5)",cache(5))
        console.log("cahce", cache(10))
    </script>
</html>
