<html>
    <script>
        class Set{
            unique =[];
            constructor(items){
                for(let item of items){
                    if(this.unique.indexOf(item) == -1){
                        this.unique.push(item)
                    }
                }
            }

            add(item){
              
                    if(this.unique.indexOf(item) == -1){
                        this.unique.push(item)
                    }
            }
            [Symbol.iterator](){
                let index = 0;
                let item = this.unique;
                return {
                    next(){
                        return {
                            done: index == item.length,
                            value: index < item.length ? item[index++] : undefined
                        };
                    }
                };
            }
        }

        
        let set = new Set([1,2,1,2,1,3,3,11])
