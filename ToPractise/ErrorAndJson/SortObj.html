<html>
<script>
    const students = [
        {
            name: "Alex Johnson",
            age: 20,
            major: "Computer Science",
            grade: "A"
        },
        {
            name: "Jordan Smith",
            age: 22,
            major: "Business Administration",
            grade: "B"
        },
        {
            name: "Taylor Swift",
            age: 21,
            major: "Graphic Design",
            grade: "A"
        },  
         {
            name: "Laylor Swift",
            age: 21,
            major: "Graphic Design",
            grade: "A"
        }
    ];

   students.sort((a,b)=>{
    if(a.age == b.age){
        return a.name.localeCompare(b.name)
    }else{
        return a.age-b.age;
    }
   });
    console.log("sortStudents ,",students)
</script>
