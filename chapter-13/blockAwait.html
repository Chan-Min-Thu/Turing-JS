<html>

<body></body>
<script>
    let url1 = 'https://jsonplaceholder.typicode.com/todos/1'
    let url2 = 'https://jsonplaceholder.typicode.com/todos/2'
    /*
    fetch(url)
        .then(response => response.json())
        .then(json => console.log(json))
        .catch(err => console.error('Error in fetching todo:', err))
    */
    async function fetchTodo() {

        try {
            let res1 = await fetch(url1);
            let json1 = await res1.json();
            let res2 = await fetch(url2);
            let json2 = await res2.json();
            console.log(json1);
            console.log(json2);
        } catch (err) {
            console.error('Error in fetching todo:', err);
        }

    }

    fetchTodo();
    console.log("fetch ended....")

    async function nonBlockAll(){
        let urls = [url1, url2];
        let promises = urls.map((url)=> fetch(url).then((res)=> res.json()));
        let [value1, value2] = await Promise.all(promises);
        console.log("success v1 ",value1, " v2 ", value2);
    }

    nonBlockAll();
</script>
