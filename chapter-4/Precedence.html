<html>
  <script>
    let result = 2 + 4 * 3 ** (2 ** 2);
    /*
     associativity level,
     ** r
     *,/ l
     +,- l
    */
    console.log("Result", result);

    let a = 4;
    /*
    a is left value and can also be right value.
    4 is right value but cann't left value.
    */
    console.log("a", a);

    let b = +a;
    console.log("b", b);

    let c = 2;
    let d = 4;

    d++;

    console.log("c+d", c + d);
  </script>
</html>
