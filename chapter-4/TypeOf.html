<html>
  <script>
    console.log("type of 3", typeof 3);
    console.log("type of 'hello'", typeof "hello");
    console.log("type of true", typeof true);
    console.log("type of {}", typeof {});
    console.log("type of []", typeof []);
    console.log("type of null", typeof null);
    console.log("type of undefined", typeof undefined);
    console.log("type of function(){}", typeof function () {});
    console.log("type of NaN", typeof NaN);
    console.log("type of Symbol('id')", typeof Symbol("id"));
  </script>
</html>
