<html>
  <script>
    let obj = {
      name: "Turing",
      age: 15,
    };

    console.log("obj instanceof object", obj instanceof Object); //true
    console.log("obj instanceof Date", obj instanceof Date); // false

    let date = new Date();
    console.log("date instanceof object", date instanceof Date); //true
    console.log("date instanceof Array", date instanceof Array); // false

    let arr = [10, 20, 30];
    console.log("arr instanceof Object", arr instanceof Object); //true
    console.log("arr instanceof Array", arr instanceof Array); //true
    console.log("arr instanceof Date", arr instanceof Date); // false

    console.log("null instanceof Object", null instanceof Object); //false
  </script>
</html>
