<html>
    <script>
        console.log("log");
        console.debug("debug");
        console.info("info");
        console.warn("warn");
        console.error("error");

        function div(a, b){
            console.assert(a !== undefined, "a is undefined");
            console.assert(b !== undefined, "b is undefined");
            return a / b;
        }
        console.log("div",div(10,2));
        console.log("div",div(10));

        // console.clear();

        let items = [1,3,4,5,6];
        console.table(items);
        let person = {
            name:"Mg Mg",
            age:25,
            city:"Yangon"
        };
        console.table(person);

        console.count("label");
        console.count("label","hello");
        console.countReset("label");
        console.count("label");

        console.group();
        console.log("level 1");
        console.group();
        console.log("level 2");
        console.groupEnd();
        console.log("back to level 1");
        console.groupEnd();
        console.log("back to main level");  

        console.time("myTimer");
        console.timeLog("myTimer");
        console.timeEnd("myTimer");
    </script>
</html>
