<html>
    <script>

        let obj = {
            name:" John Doe",
            age: 30,
            city: "New York",
            _private:"secret",
            items:[1,1,3,4],
            display(){
                console.log(this.name + " is " + this.age + " years old and lives in " + this.city);
            },
            toJSON(){
                return {
                    username:this.name,
                    age:this.age,
                    city:this.city,
                    specialName:this.username
                };
            }
        };

        let jsonObj = JSON.stringify(obj); //serialization
        console.log(" jsonObj :",jsonObj);

        let obj2 = JSON.parse(jsonObj,function(key,value){
            if(key[0] == "_"){
                return undefined;
            }
            return value;
        }   ); // deserialization
        console.log(" obj2 :",obj2);
    </script>
</html>
