<html>
    <script>
        // User name can only contain letters and numbers
        // a122,mg12,Ko11
        function isAZ(str){
            let code = str.charCodeAt(0);
            return code >=65 && code <=90
        }
        function isaz(str){
            let code = str.charCodeAt(0);
            return code >=97 && code <=122
        }
        function isLetter(str){
            return isAZ(str) || isaz(str);
        }

        function isDigit(str){
            let code = str.charCodeAt(0);
            return code >=48 && code <=57
        }
        function validStr(str){
            let firstLetter = isLetter(str[0]) 
            let letterOrDigit = true;
            for(let i=1; i < str.length ;i++){
                let char = str[i];
                letterOrDigit &&= isLetter(char) || isDigit(char);
            }
            return firstLetter && letterOrDigit;
        }
        console.log(validStr("a122"));
        console.log(validStr("apple1243"));
          console.log(validStr("apple1243@"));
    </script>
</html>
