<html>
    <script>
        let pattern = /^A/;

        console.log(`${pattern} Abc`, pattern.test("Abc")); // true
        console.log(`${pattern} abc`, pattern.test("abc")); // false

        console.log(" ");
        pattern =/^Java/; // Java နဲ့ start ဖြစ်ရမယ်
        console.log(`${pattern} JavaScript`, pattern.test("JavaScript")); // true
        console.log(`${pattern} Java`, pattern.test("Java")); // true

        console.log(" ");
        pattern =/Script$/; // Script နဲ့ end ဖြစ်ရမယ်
        console.log(`${pattern} JavaScript`, pattern.test("JavaScript")); // true
        console.log(`${pattern} Java`, pattern.test("Java")); // false

        console.log(" ");
        pattern =/[abc]$/; // a, b, c တစ်ခုခုနဲ့ end ဖြစ်ရမယ်
        console.log(`${pattern} Bob`, pattern.test("Bob")); // true
        console.log(`${pattern} Cook`, pattern.test("Cook")); // false
        console.log(`${pattern} Coc`, pattern.test("Coc")); // true

        console.log(" ");
        pattern =/[^abc]$/; // a, b, c တစ်ခုခုနဲ့ end မဖြစ်ရ
        console.log(`${pattern} Bob`, pattern.test("Bob")); // false
        console.log(`${pattern} Cook`, pattern.test("Cook")); // true
        console.log(`${pattern} Coc`, pattern.test("Coc")); // false

        console.log(" ");
        pattern =/.$/; // မည်သည့် character မဆိုရ \n မရ
        console.log(`${pattern} Bob`, pattern.test("Bob")); // true
        console.log(`${pattern} Cook`, pattern.test("Cook")); // true
        console.log(`${pattern} Coc`, pattern.test("Coc")); // true
        console.log(`${pattern} cat\n`, pattern.test("cat\n")); // false
    </script>
</html>
