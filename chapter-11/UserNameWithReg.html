<html>
    <script>
        let pattern = /^[a-zA-Z]([a-zA-Z]|[0-9])*$/

        console.log("is Valid for Apple123", pattern.test("Apple123"));
        console.log("is Valid for 123Apple", pattern.test("123Apple"));
        console.log("is Valid for Apple123@", pattern.test("Apple123@"));
    </script>
</html>
