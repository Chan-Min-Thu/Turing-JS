  <script>
    let set = new Set([1,2,3,4,5,1,2,4,1,1,2,3,1,2,6]);
    console.log("set",set); // Set(6) { 1, 2, 3, 4, 5, 6 }

    set.add(7);
    console.log("set",set); // Set(7) { 1, 2, 3, 4, 5, 6, 7 }
    set.add(1);
    console.log("set",set); // Set(7) { 1, 2, 3, 4, 5, 6, 7 }
    set.size; // 7
    set.delete(1);    
    console.log("set",set); // Set(6) { 2, 3, 4, 5, 6, 7 }
    set.has(1); // false
    set.has(2); // true
    for(const item of set){
        console.log(item); // 2,3,4,5,6,7
    }
    set.clear(); // clear all items in set

  </script>
