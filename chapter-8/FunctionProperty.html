<html>
  <script>
    function hello() {
      console.log("hello.data", hello.data);
      console.log("hello.length", hello.length);
      console.log("hello.prototype", hello.prototype);
    }
    hello.data="chanminthu";
    console.log("hello.data", hello.data);
    hello();
    console.log(".....");
    function hello2(a, b) {
      console.log("arguments.length", arguments.length);
      if (arguments.length !== 2) {
        console.log("Invalid number of arguments");
      }
      return a + b;
    }
    console.log("hello()", hello());
    console.log("hello2(1)", hello2(1));
    console.log("hello2(1,2)", hello2(1, 2));
  </script>
</html>
