       function Stack (){
        let items = [];

        function push (item){
            items.push(item);
        }

        function pop(){
            items.pop();
        }
        return {
            push,
            pop
        }
       }
       let stack = Stack()
       stack.items = [1,2,3];
       console.log(stack.items);
       console.log(stack);
       console.log(stack.push(100));
       console.log(stack.pop());
