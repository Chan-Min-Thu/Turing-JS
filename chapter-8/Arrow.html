<html>
    <script>
        function add (a,b){
            return a + b;
        } // declare the function
        let result = add(1, 3); // invoke the function
        console.log(result);

        // arrow function
        let add2 = (a,b) => a + b; // declare the function
        let result2 = add2(1, 3); // invoke the function
        console.log(result2);

        const h = x=> { value:x};
        console.log("h(5)",h(5)); //undefined because the function does not return anything 
        // if you want to get object, you need to return it
        const h2 = x=> ({ value:x });
        console.log("h2(5)",h2(5)); //{ value: 5}
    </script>
</html>
