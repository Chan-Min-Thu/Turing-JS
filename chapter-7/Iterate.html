<html>
  <script>
    let arr = [1, 2, 3, 4, 5];
    for (const ele of arr) {
      console.log("element", ele);
    }

    for (const [index, value] of arr.entries()) {
      console.log(` arr ${index} of value = ${value} `);
      arr[index] = value * 2;
    }
    console.log("arr", arr);

    arr.forEach((item, index, array) => {
      console.log(`index array of ${index}= ${item}`);
      arr[index] = item * 2;
    });
    console.log("arr", arr);
  </script>
</html>
