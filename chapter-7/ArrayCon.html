<html>
  <script>
    let arr = new Array();
    console.log(arr); // enpty array

    let arr1 = new Array(5); // length
    console.log(arr1[1]);

    let arr2 = new Array(10, 3, 5);
    console.log(arr2);

    let arr4 = Array.of(1, 2, 3, 4, 5);
    console.log("arr4", arr4);

    let arr5 = Array.from(arr4);
    console.log("arr5", arr5);
  </script>
</html>
