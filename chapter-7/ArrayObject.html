<html>
  <script>
    let arr = [1, 2, 3, 4, 5];

    arr["5"] = 100; // 5 is index or element
    arr[3] = 300; // index or element
    arr.another = "hello"; // property
    arr[1.1] = 400; // property

    console.log("arr", arr);
    console.log("arr.length", arr.length);
    for (const item of arr) {
      console.log("item ,", item);
    }
    console.log("arr.another", arr.another);

    let arr2 = new Array(100);
    arr2[0] = 5;
    arr2[99] = 100;
    console.log("arr2", arr2); //sparse array
  </script>
</html>
