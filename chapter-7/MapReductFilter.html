<html>
  <script>
    let students = [
      {
        name: "Aung Aung",
        gender: "Male",
        age: 20,
      },
      {
        name: "Zin Zin",
        gender: "Female",
        age: 22,
      },
      {
        name: "Aung Zaw",
        gender: "Male",
        age: 26,
      },

      {
        name: "Myo Aung",
        gender: "Female",
        age: 28,
      },
      {
        name: "Aung Kyaw",
        gender: "Male",
        age: 22,
      },
    ];

    let youngestFemale = students
      .filter((stu) => stu.gender === "Female")
      .reduce((stuA, stuB) => (stuA.age < stuB.age ? stuA : stuB));
    console.log("youngest Female", youngestFemale);

    let sortStudentsByAge = students.sort((stuA, stuB) => stuA.age - stuB.age);
    console.log("sortStudents by Age", sortStudentsByAge);
    let sortStudentsByName = students.sort((stuA, stuB) => {
      if(stuA.age === stuB.age){
        return stuA.name.localeCompare(stuB.name)
      }else{
        return stuA.age - stuB.age
      }});
    console.log("sortStudents by Name", sortStudentsByName);
  </script>
</html>
