<html>
  <script>
    let arr = [1, 2, 3, 4, 5, 6];

    let arr2 = arr.map((x) => x * 2);
    console.log("arr2 ,", arr2);
    let arr3 = arr.filter((x) => x % 2 === 0);
    console.log("arr3 ,", arr3);

    let greaterThan3 = arr.find((x) => x > 3);
    console.log("greater than 3,", greaterThan3);

    let indexOfgreaterThan3 = arr.findIndex((x) => x > 3);
    console.log("index of greater than 3,", indexOfgreaterThan3);

    let allGreaterThan0 = arr.every((x) => x > 0); // Every elements must be greater than 0;
    console.log("all greater than 0 ,", allGreaterThan0); // true

    let arr4 = [-1, 1, 2, 3, 12];
    let allGreaterThan0InArr4 = arr4.every((x) => x > 0);
    console.log("all greater than 0 in arr4,", allGreaterThan0InArr4); // false

    let someGreaterThan10 = arr4.some((x) => x > 10);
    console.log("Some greater than 10 in arr4", someGreaterThan10);
  </script>
</html>
