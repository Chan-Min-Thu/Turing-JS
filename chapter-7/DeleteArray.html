<html>
  <script>
    let arr = [1, 2, 3];

    // delete arr[1];
    // console.log(arr);

    arr.splice(1, 1);
    console.log(arr);

    let arr2 = [10, 20, 30, 40, 50, 60];
    let itemsToDelete = [30, 40, 50];

    let indexestoDelete = [];

    for (const item of itemsToDelete) {
      indexestoDelete.push(arr2.indexOf(item));
    }
    console.log(indexestoDelete);
    for (const index of indexestoDelete.reverse()) {
      arr2.splice(index, 1);
    } // reverse() is used to delete from the end of the array to avoid index shifting issues

    console.log(arr2);
  </script>
</html>
