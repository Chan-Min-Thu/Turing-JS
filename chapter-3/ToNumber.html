<html>
  <script>
    // String to number
    console.log("+'10'", +"10");
    console.log("+''", +"");
    console.log("+'hello'", +"hello");

    // boolean to number
    console.log("true", +true);
    console.log("false", +false);

    //null & undefined to number
    console.log("null", +null);
    console.log("undefined", +undefined);
  </script>
</html>
