<html>
  <script>
    /*
    Primitive types 
     -number
     -string
     -boolean
     -null
     -undefined
     -symbol
     -bigInt

    Object types
     -collections of properties
    */
    let a = 7;
    console.log("type of a :", typeof a);

    a = " Hello World!";
    console.log("type of a :", typeof a);

    a = true;
    console.log("type of a :", typeof a);

    a = null;
    console.log("type of a :", typeof a);

    a = undefined;
    console.log("type of a :", typeof a);
  </script>
</html>
